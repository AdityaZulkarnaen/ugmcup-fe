##
## Konsolidasi alamat UGM CUP 2026 + reverse proxy ke Next.js.
##
## Tujuan: HANYA SATU alamat yang pernah melayani konten —
## https://ugmcup2026.com. Semua varian lain (www, http, akses lewat IP atau
## DNS bawaan EC2) tidak boleh ikut menyajikan halaman yang sama, karena bagi
## Google itu terhitung situs duplikat dan sinyal SEO-nya terpecah.
##
## Pasang:
##   sudo cp deploy/nginx/ugmcup2026.com.conf /etc/nginx/sites-available/ugmcup2026.com
##   sudo ln -sf /etc/nginx/sites-available/ugmcup2026.com /etc/nginx/sites-enabled/
##   sudo rm -f /etc/nginx/sites-enabled/default
##   sudo nginx -t && sudo systemctl reload nginx
##
## Sertifikatnya harus mencakup apex DAN www, kalau tidak blok nomor 2 di bawah
## akan gagal handshake:
##   sudo certbot --nginx -d ugmcup2026.com -d www.ugmcup2026.com
##

# ---------------------------------------------------------------------------
# 1. Semua HTTP -> HTTPS apex, sekali lompat.
#    Sengaja langsung ke tujuan akhir: http://www -> https://www -> https://apex
#    itu dua redirect, dan rantai redirect memperlambat crawler.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ugmcup2026.com www.ugmcup2026.com;

    # Biarkan certbot memperpanjang sertifikat lewat HTTP-01 tanpa kena redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://ugmcup2026.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 2. HTTPS www -> HTTPS apex.
#    Ini blok yang benar-benar melakukan konsolidasi: tanpa ini, www melayani
#    salinan situs yang identik.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ugmcup2026.com;

    ssl_certificate     /etc/letsencrypt/live/ugmcup2026.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ugmcup2026.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ugmcup2026.com$request_uri;
}

# ---------------------------------------------------------------------------
# 3. Alamat utama -> Next.js (PM2 di 127.0.0.1:3000).
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ugmcup2026.com;

    ssl_certificate     /etc/letsencrypt/live/ugmcup2026.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ugmcup2026.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Next.js sudah punya limit sendiri, tapi upload gambar dari dashboard media
    # lewat sini juga — beri ruang.
    client_max_body_size 25m;

    # Sengaja TIDAK menyalakan `gzip` di sini. Next.js sudah mengompresi
    # responsnya sendiri; kalau nginx ikut mengompresi, hasilnya cuma CPU
    # terbuang untuk data yang sudah kecil.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Tanpa ini Next.js mengira dirinya diakses lewat http, dan URL absolut
        # yang dihasilkannya (termasuk redirect) bisa turun ke http.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Next.js melakukan streaming SSR (Suspense, streaming metadata).
        # Buffering nginx menahan potongan-potongan itu sampai respons selesai,
        # yang menghapus seluruh manfaat streaming.
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}

# ---------------------------------------------------------------------------
# 4. Tutup semua alamat lain.
#
#    Ini bagian yang paling sering terlewat. Tanpa default server, mengakses
#    EC2 lewat IP publik atau lewat ec2-xx-xx.compute.amazonaws.com akan
#    dilayani oleh server block pertama — artinya situs yang sama hidup di
#    beberapa alamat sekaligus dan bisa terindeks Google.
#
#    444 = tutup koneksi tanpa respons. Untuk HTTPS dipakai
#    `ssl_reject_handshake` supaya nginx menolak sebelum TLS selesai, jadi
#    tidak perlu sertifikat untuk nama-nama itu (butuh nginx >= 1.19.4).
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
